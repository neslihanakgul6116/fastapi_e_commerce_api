<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ödeme Ekranı - E-Ticaret</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100 text-gray-800 pb-12">

    <!-- Üst Bar -->
    <header class="bg-white shadow-sm sticky top-0 z-50">
        <div class="container mx-auto px-4 py-3 flex items-center justify-between">
            <a href="/cart-page" class="text-sm font-semibold text-orange-500 hover:underline">
                <i class="fa-solid fa-arrow-left"></i> Sepete Dön
            </a>
            <h1 class="text-base font-bold text-gray-800">Ödeme ve Adres Bilgileri</h1>
            <div></div>
        </div>
    </header>

    <!-- İçerik Formu -->
    <main class="container mx-auto px-4 py-6 max-w-lg">
        <form onsubmit="completeOrder(event)" class="space-y-4 bg-white p-6 rounded-2xl shadow-sm border">
            <div>
                <label class="block text-xs font-bold text-gray-700 mb-1">Ad Soyad</label>
                <input type="text" required class="w-full px-3 py-2 border rounded-xl text-sm focus:outline-none focus:border-orange-500" placeholder="Adınız Soyadınız">
            </div>
            <div>
                <label class="block text-xs font-bold text-gray-700 mb-1">Teslimat Adresi</label>
                <textarea required rows="3" class="w-full px-3 py-2 border rounded-xl text-sm focus:outline-none focus:border-orange-500" placeholder="Açık adresinizi yazın..."></textarea>
            </div>

            <!-- Banka Seçimi -->
            <div>
                <label class="block text-xs font-bold text-gray-700 mb-2">Banka / Kart Seçimi</label>
                <div class="grid grid-cols-3 gap-2">
                    <label class="border rounded-xl p-2.5 flex flex-col items-center justify-center cursor-pointer hover:border-orange-500 transition text-xs font-semibold text-center">
                        <input type="radio" name="bank" value="Garanti" required class="mb-1 accent-orange-500"> Garanti BBVA
                    </label>
                    <label class="border rounded-xl p-2.5 flex flex-col items-center justify-center cursor-pointer hover:border-orange-500 transition text-xs font-semibold text-center">
                        <input type="radio" name="bank" value="Akbank" class="mb-1 accent-orange-500"> Akbank
                    </label>
                    <label class="border rounded-xl p-2.5 flex flex-col items-center justify-center cursor-pointer hover:border-orange-500 transition text-xs font-semibold text-center">
                        <input type="radio" name="bank" value="İş Bankası" class="mb-1 accent-orange-500"> İş Bankası
                    </label>
                    <label class="border rounded-xl p-2.5 flex flex-col items-center justify-center cursor-pointer hover:border-orange-500 transition text-xs font-semibold text-center">
                        <input type="radio" name="bank" value="Yapı Kredi" class="mb-1 accent-orange-500"> Yapı Kredi
                    </label>
                    <label class="border rounded-xl p-2.5 flex flex-col items-center justify-center cursor-pointer hover:border-orange-500 transition text-xs font-semibold text-center">
                        <input type="radio" name="bank" value="Ziraat" class="mb-1 accent-orange-500"> Ziraat Bankası
                    </label>
                    <label class="border rounded-xl p-2.5 flex flex-col items-center justify-center cursor-pointer hover:border-orange-500 transition text-xs font-semibold text-center">
                        <input type="radio" name="bank" value="Diğer" class="mb-1 accent-orange-500"> Diğer Bankalar
                    </label>
                </div>
            </div>

            <div>
                <label class="block text-xs font-bold text-gray-700 mb-1">Kart Numarası</label>
                <input type="text" required maxlength="19" class="w-full px-3 py-2 border rounded-xl text-sm focus:outline-none focus:border-orange-500" placeholder="XXXX XXXX XXXX XXXX">
            </div>
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-bold text-gray-700 mb-1">Son Kullanma Tarihi</label>
                    <input type="text" required maxlength="5" class="w-full px-3 py-2 border rounded-xl text-sm focus:outline-none focus:border-orange-500" placeholder="AA/YY">
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-700 mb-1">CVV</label>
                    <input type="password" required maxlength="3" class="w-full px-3 py-2 border rounded-xl text-sm focus:outline-none focus:border-orange-500" placeholder="XXX">
                </div>
            </div>

            <button type="submit" class="w-full bg-orange-500 text-white py-3 rounded-xl text-sm font-bold hover:bg-orange-600 transition shadow-sm mt-4">
                Ödemeyi Onayla ve Siparişi Tamamla
            </button>
        </form>
    </main>

    <script>
        function completeOrder(event) {
            event.preventDefault();
            alert("Tebrikler! Siparişiniz başarıyla alındı.");
            window.location.href = "/";
        }
    </script>
</body>
</html>
